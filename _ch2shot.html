<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#171310}canvas{display:block}</style>
</head><body>
<canvas id="c" width="960" height="600"></canvas>
<script src="js/core/util.js"></script>
<script src="js/core/render.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/game/minigames.js"></script>
<script src="js/data/minigames/chapter2.js"></script>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var gameId = p.get("g") || "firstNinety";
  var mode = p.get("s") || "";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 960, H = 600;

  // --- replica of G.minigameHost.draw() so the shot shows the real frame ---
  ctx.fillStyle = "#2a241e";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(42,36,30,.58)";
  ctx.fillRect(0, 0, W, H);
  var px = 40, py = 30, pw = W - 80, ph = H - 60;
  G.render.panel(ctx, px, py, pw, ph, {
    fill: "rgba(74,63,51,.97)", stroke: "rgba(217,164,76,.55)", radius: 14, inner: true
  });
  var def = G.minigames.list[gameId];
  ctx.save();
  ctx.font = "bold 20px 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = "#f2dfae";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(def.title || "", px + 26, py + 42);
  if (def.subtitle) {
    ctx.font = "13px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "rgba(244,236,224,.62)";
    ctx.fillText(def.subtitle, px + 26, py + 64);
  }
  ctx.restore();

  var api = {
    w: W, h: H, cfg: {}, mouse: { x: 0, y: 0 },
    state: { flags: {}, intel: ["intel_zarina", "intel_bekzod"], trust: 0, beat: "open", scores: {} },
    sound: { blip() {}, tick() {}, select() {}, good() {}, bad() {}, win() {} },
    finish(r) { window.__result = r; }
  };
  if (mode === "forgiving") api.cfg = { seconds: 70, forgiving: true };
  var inst = def.create(api);

  function step(n) { for (var i = 0; i < (n || 1); i++) { inst.update(0.05); } }

  if (gameId === "firstNinety") {
    if (mode === "two") { inst.onKey("1"); inst.onKey("4"); step(20); }
    if (mode === "done" || mode === "cold") {
      if (mode === "done") { inst.onKey("1"); inst.onKey("4"); inst.onKey("2"); }
      else { inst.onKey("4"); inst.onKey("1"); inst.onKey("2"); }
      step(60);
    }
  } else {
    if (mode === "name") { inst.debugName(0); step(2); }
    if (mode === "detail") { inst.debugName(0); inst.debugPick(0); step(2); }
    if (mode === "summary") {
      for (var i = 0; i < 5; i++) { inst.debugName(i); var c = 5; inst.debugPick(0); step(1); }
      inst.onKey("space"); step(10);
    }
  }

  ctx.save();
  ctx.beginPath();
  ctx.rect(px + 14, py + 78, pw - 28, ph - 78 - 44);
  ctx.clip();
  ctx.translate(px + 14, py + 78);
  inst.draw(ctx);
  ctx.restore();

  if (def.controls) {
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.font = "12px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#cbb79a";
    ctx.textAlign = "center";
    ctx.fillText(def.controls, W / 2, py + ph - 18);
    ctx.restore();
  }
  window.__ready = true;
})();
</script>
</body></html>
